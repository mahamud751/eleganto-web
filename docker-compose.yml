services:
  postgres:
    image: postgres:16-alpine
    container_name: eleganto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eleganto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - eleganto_pgdata:/var/lib/postgresql/data
volumes:
  eleganto_pgdata:
